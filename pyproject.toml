[project]
name = "minidb"
version = "0.1.0"
description = "A small SQLite-like relational database written from scratch in Python"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # sqlite3 (the reference in differential tests) warns about a binding style we test on purpose
    "ignore:Binding .* is a named parameter:DeprecationWarning",
]
