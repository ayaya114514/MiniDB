name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"  # weekly: new fuzz seeds even without commits
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - uses: actions/cache@v4
        with:
          path: .reference-sqlite
          key: reference-sqlite-${{ runner.os }}-${{ hashFiles('tools/reference_sqlite.py') }}
      - name: Build the reference SQLite (plain SQLite from sqlite.org, pinned version)
        shell: bash  # -eo pipefail: a failed build must fail the step
        run: python tools/reference_sqlite.py | sed 's/^export //' >> "$GITHUB_ENV"
      - name: SQLite version used as the reference
        run: python -c "import sqlite3, sys; print(sys.version); print('SQLite', sqlite3.sqlite_version)"
      - run: python -m pytest

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: .reference-sqlite
          key: reference-sqlite-${{ runner.os }}-${{ hashFiles('tools/reference_sqlite.py') }}
      - name: Build the reference SQLite (plain SQLite from sqlite.org, pinned version)
        shell: bash  # -eo pipefail: a failed build must fail the step
        run: python tools/reference_sqlite.py | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Differential fuzzing against sqlite3 (fixed seeds)
        run: python tests/fuzz.py --seeds 0-299 --statements 400
      - name: Differential fuzzing with database files
        run: python tests/fuzz.py --file --seeds 5000-5099 --statements 400
      - name: Differential fuzzing (new seeds every run)
        run: |
          start=$((100000 + GITHUB_RUN_NUMBER * 200))
          python tests/fuzz.py --seeds "$start-$((start + 199))" --statements 400
